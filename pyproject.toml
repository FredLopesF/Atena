[project]
name = "myrd"
version = "2.0.0"
description = "MyRD — Personal ROM downloader using Archive.org as source"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "cloudscraper>=1.2",
    "customtkinter>=5.2",
    "lxml>=5.0",
    "pillow>=10.0",
    "psutil>=6.0",
    "requests>=2.32",
    "keyring>=25.0",
]

[project.scripts]
myrd = "main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pyrefly]
project_includes = ["."]
search_path = ["."]
